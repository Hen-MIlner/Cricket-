["bat","bowl"].forEach(k=>0);const AB={"Aggressive opener":["pow",8],"Classical Test batter":["tech",8],"Power hitter":["pow",10],"Anchor":["conc",8],"Finisher":["tim",8],"Express fast bowler":["pace",10],"Swing bowler":["vari",8],"Death bowler":["acc",8],"Wrist spinner":["vari",10],"Defensive spinner":["acc",8]};const q=AB[f.arch];if(q)S[q[0]]=clamp(S[q[0]]+q[1]);if(f.path=="Academy"){["tech","tim","pow","conc","field"].forEach(k=>S[k]+=4);S.rep=10;S.money+=1500}startSeason();save();render()}

function startSeason(){const L=LV[S.lv];S.nextOpp=pick(seasonOpponents());S.round=1;S.rounds=S.country==="England"&&S.lv===2?(S.engFormat==="The Hundred"?8:S.engFormat==="Metro Bank One-Day Cup"?8:12):(L.rounds||10);S.ladder={};(S.lv==0&&S.country!=="England"?SACLUBS.map(c=>c[0]):seasonOpponents().concat([teamName()])).forEach(t=>S.ladder[t]=0);S.stats["s"+S.lv]=S.stats["s"+S.lv]||{m:0,inn:0,runs:0,balls:0,no:0,hs:0,h:0,f:0,ov:0,rc:0,w:0,bb:"0/0"};S.sel=true}

function simBat(p,opp,ov,strat){let balls=0,runs=0,out=false,log=[];const maxB=ov*6,q=eff(p),oq=opp;let fat=0;
const ph=Math.ceil(ov/3),stances=strat;

const r=Math.random();balls++;let x=0,txt="";if(r<pOut){out=true;txt="OUT! "+pick(["bowled","caught behind","LBW","caught in the deep","run out"]);}else{const u=Math.random()*(1+edge)*st[0];
x=u>1.55?6:u>1.25?4:u>.85?pick([1,2]):u>.55?1:0;if(st==STANCES.Defend&&x>2)x=1;txt=x==0?"dot ball":x==4?"FOUR!":x==6?"SIX!":x+" run"+(x>1?"s":"");runs+=x}

function simBowl(p,opp,ov,mode){let w=0,rc=0,balls=Math.min(ov,S.lv==3?4:10)*6;const q=eff(p),m=mode=="Attack"?[1.3,1.25]:mode=="Economy"?[.7,.75]:[1,1],e=(q-opp)/100;const lg=[];
for(let i=1;i<=balls;i++){if(Math.random()<clamp(.03*(1+e)*m[0],.005,.12)){w++;lg.push("Over "+Math.ceil(i/6)+": WICKET!")}else rc+=Math.random()<.12*(1-e)*m[1]?4:Math.random()<.4*(1-e*.5)*m[1]?1:0}

function matchOvers(){if(S.country==="England"&&S.lv===2)return S.engFormat==="Vitality Blast"?20:S.engFormat==="The Hundred"?17:50;return LV[S.lv].ov}
function play(bs,bwm){const p=S,L=LV[S.lv],overs=matchOvers(),stt=S.stats["s"+S.lv],oppName=S.nextOpp||pick(seasonOpponents()),opp=L.s+R(-8,8),lines=[];
const bat=p.role!="bowler"||Math.random()<.3?simBat(p,opp,overs,bs):null;let bowl=null;if(p.role!="batter")bowl=simBowl(p,opp,overs,bwm);
const mine=bat?bat.runs:10+R(0,15)|0,teamScore=Math.round(mine+overs*R(2.6,4.8)*(overs<=20?1.8:1)*(.9+rating(p)/400)+overs*(overs<=20?.8:.4)*R(2,5)/3);
const oppScore=Math.round(overs*R(2.4,4.6)*(overs<=20?1.8:1)*opp/65-(bowl?bowl.w*3:0));const win=teamScore>oppScore+(Math.random()*20-10)|0;

if(bowl){stt.ov+=bowl.ov;stt.rc+=bowl.rc;stt.w+=bowl.w;const[bw,br]=stt.bb.split("/").map(Number);if(bowl.w>bw||(bowl.w==bw&&bowl.rc<br))stt.bb=bowl.w+"/"+bowl.rc;lines.push(...bowl.log);lines.push("<b>Bowling: "+bowl.w+"/"+bowl.rc+" off "+bowl.ov+"</b>")}

const TR={"Batting technique":["tech",3],"Timing":["tim",3],"Power hitting":["pow",3],"Concentration":["conc",3],"Pace":["pace",4],"Accuracy":["acc",3],"Variations":["vari",3],"Fielding":["field",2],"Fitness":["fit",4]};

      A.innerHTML=`<h1>Email</h1><div class="sub">Club inbox · Selection, coaching, reports and contracts</div><div class="card"><div class="g2"><div><div class="lbl">Inbox</div><div class="big">${mails.length}</div></div><div><div class="lbl">Unread</div><div class="big">${S.unread||0}</div></div></div><button class="btn" onclick="composeCoach()" style="width:100%;margin-top:12px">＋ New message to coach</button>${S.composeOpen?`<div style="margin-top:14px"><div class="lbl">To</div><select id="mailTo"><option>Head Coach</option><option>Batting Coach</option><option>Bowling Coach</option><option>Fitness Coach</option><option>Team Manager</option><option>Selector</option></select><div class="lbl">Subject</div><input id="mailSubject" placeholder="What do you want to ask?"><div class="lbl">Message</div><textarea id="mailBody" rows="4" style="width:100%;background:#0e1630;border:1px solid var(--b);border-radius:14px;color:var(--t);padding:13px" placeholder="Write your message..."></textarea><div class="g2"><button class="btn" onclick="sendCoachMessage()">Send message</button><button class="btn o" onclick="S.composeOpen=false;render()">Cancel</button></div></div>`:''}</div>${selected?`<div class="card"><button class="btn o" onclick="S.openMail=null;render()">← Back to inbox</button><h3 style="margin-top:14px">${selected.subject}</h3><div class="sub">From ${selected.from} · ${selected.date}</div><p style="white-space:pre-line">${selected.body}</p><button class="btn" onclick="replyMail(${selected.id})">Reply</button></div>`:`<div class="card"><h3>Inbox</h3>${mails.length?mails.map(m=>`<button class="opt" style="width:100%;margin:5px 0;${m.read?'opacity:.7':''}" onclick="openMail(${m.id})"><b>${m.read?'':'● '}${m.subject}</b><small>${m.from} · ${m.date}</small></button>`).join(''):'<p class="sub">No messages yet. Play or skip a round to receive club updates.</p>'}</div>`}<div class="card"><h3>Sent messages</h3>${sent.length?sent.map(m=>`<div style="padding:8px 0;border-bottom:1px solid var(--b)"><b>${m.subject}</b><div class="sub">To ${m.from} · ${m.date}</div><div class="sub">${m.body}</div></div>`).join(''):'<span class="sub">Messages you send will appear here.</span>'}</div><div class="card"><h3>Ask for advice</h3><div class="g2"><button class="opt" onclick="coachAdvice('batting')">Batting coach</button><button class="opt" onclick="coachAdvice('bowling')">Bowling coach</button><button class="opt" onclick="coachAdvice('fitness')">Fitness coach</button><button class="opt" onclick="coachAdvice('selection')">Head coach / selector</button></div></div>`;
    }
    if(tab==='rankings'){
      const r=rating(S),world=Object.entries(S.ladder||{}).sort((a,b)=>b[1]-a[1]),st=S.stats['s'+S.lv]||{runs:0,w:0,m:0};const peerNames=['Oliver James','Noah Williams','Liam Brown','Jack Wilson','Mason Taylor','Charlie Martin','Ethan Clark','Leo White','Oscar Harris'];const peers=peerNames.map((name,i)=>({name,score:Math.max(25,Math.min(96,48+i*4+Math.round(Math.sin((S.season+i)*2)*9))),runs:Math.max(0,Math.round((i+1)*31+S.season%7*8)),wickets:Math.max(0,Math.round((9-i)*2.3))}));peers.push({name:S.name,score:r,runs:st.runs||0,wickets:st.w||0,you:true});peers.sort((a,b)=>b.score-a.score);const pos=peers.findIndex(x=>x.you)+1;
      A.innerHTML=`<h1>Rankings</h1><div class="sub">Career rankings · Current competition</div><div class="card"><h3>Your player ranking</h3><div class="g3"><div><div class="big">#${pos}</div><div class="lbl">League rank</div></div><div><div class="big">${r}</div><div class="lbl">Overall</div></div><div><div class="big">${Math.round(S.rep)}</div><div class="lbl">Reputation</div></div></div><p class="sub">Simulated player rankings based on overall ability. This is an in-game table, not an official cricket board ranking.</p><table>${peers.map((p,i)=>`<tr style="${p.you?'color:var(--a);font-weight:700':''}"><td>#${i+1}</td><td>${p.name}${p.you?' (You)':''}</td><td align="right">${p.score} OVR</td></tr>`).join('')}</table></div><div class="card"><h3>${LV[S.lv].n} team ladder</h3><table>${world.map((x,i)=>`<tr style="${x[0]===teamName()?'color:var(--a);font-weight:700':''}"><td>${i+1}</td><td>${x[0]}${x[0]===teamName()?' (You)':''}</td><td align="right">${x[1]} pts</td></tr>`).join('')}</table></div>`;
    }
    if(tab==='trophies'){
      const t=S.trophies||[];A.innerHTML=`<h1>Trophies & Awards</h1><div class="card"><div class="g3"><div><div class="big">${t.length}</div><div class="lbl">Trophies</div></div><div><div class="big">${S.awards.length}</div><div class="lbl">Awards</div></div><div><div class="big">${S.season}</div><div class="lbl">Season</div></div></div></div><div class="card"><h3>Honours cabinet</h3>${t.length?t.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--b)">🏆 <b>${x.title}</b><div class="sub">${x.date} · ${x.detail}</div></div>`).join(''):'<p class="sub">No trophies yet. Finish seasons, win competitions and earn individual awards.</p>'}${S.awards.map(x=>`<div style="padding:8px 0">🥇 ${x}</div>`).join('')}</div>`;
    }
    if(tab==='timeline'){
      const t=S.timeline||[];A.innerHTML=`<h1>Career Timeline</h1><div class="sub">Your cricket journey, milestones and key decisions</div><div class="card">${t.length?t.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--b)"><div class="pill">${x.date}</div><h3 style="margin-top:8px">${x.title}</h3><div class="sub">${x.body}</div></div>`).join(''):'<p class="sub">Your career events will appear here.</p>'}</div>`;
    }
    if(tab==='squads'){if(S.country==='England'){const squads={'England county clubs':ENG_COUNTIES,'County Championship Division One (2027)':ENG_DIV1,'County Championship Division Two (2027)':ENG_DIV2};A.innerHTML=`<h1>England county teams</h1><div class="sub">18 first-class counties · Official county club names. Opponent player names remain fictional.</div>${Object.entries(squads).map(([team,players])=>`<div class="card"><h3>${team}</h3><div class="sub">${players.length} teams</div><div class="g2">${players.map((p,i)=>`<div style="padding:7px 3px;border-bottom:1px solid var(--b)"><span class="sub">${String(i+1).padStart(2,'0')}</span> ${p}</div>`).join('')}</div></div>`).join('')}<div class="card"><small class="sub">2027 Championship divisions are shown as a reference snapshot. County line-ups and player squads change each season.</small></div>`;}else{const squads={'South Australia Redbacks (2026–27)':['Wes Agar','Jordan Buckingham','Alex Carey','Brendan Doggett','Jake Fraser-McGurk','Matthew Gilkes','Travis Head','Henry Hunt','Hanno Jacobs','Spencer Johnson','Jake Lehmann','Ben Manenti','Nathan McAndrew','Noah McFadyen','Nathan McSweeney','Harry Nielsen','Lloyd Pope','Henry Thornton','Campbell Thompson','Jason Sangha','Liam Scott','Mackenzie Harvey','Jerrssis Wadia','Jake Weatherald'],'Adelaide Strikers BBL|16 contracted':['Lachie Bangs','Alex Carey','Mark Chapman','Mackenzie Harvey','Thomas Kelly','Nathan McAndrew','Lloyd Pope','Haris Rauf','Jason Sangha','Liam Scott','Harjas Singh','Matt Short','Ben Stokes','Tom Straker','Henry Thornton','Jerrssis Wadia']};A.innerHTML=`<h1>Real squads</h1><div class="sub">2026–27 squad snapshots · Player lists can change during the season</div>${Object.entries(squads).map(([team,players])=>`<div class="card"><h3>${team}</h3><div class="sub">${players.length} listed players</div><div class="g2">${players.map((p,i)=>`<div style="padding:7px 3px;border-bottom:1px solid var(--b)"><span class="sub">${String(i+1).padStart(2,'0')}</span> ${p}</div>`).join('')}</div></div>`).join('')}<div class="card"><small class="sub">Squad snapshots based on Cricket Australia / cricket.com.au reporting. BBL contracted list is not the same as a match-day XI. Some player availability depends on national duties and injuries.</small></div>`;}}
    save();
  };
  function contractMarket(){const level=S.lv,base=(S.country==="England"?[900,18000,32000,55000,120000]:[450,18000,14000,65000,120000])[level];return Math.round(base*(.55+rating(S)/100)*(.75+S.rep/100));}
  function acceptContract(){const o=S.pendingOffer;if(!o)return;S.contract={name:o.club+' playing contract',club:o.club,level:S.lv,salary:o.salary,signingBonus:o.signingBonus,yearsLeft:o.years,squadRole:o.role,performanceBonus:o.performanceBonus,season:S.season};S.money+=o.signingBonus;S.earnings=(S.earnings||500)+o.signingBonus;S.timeline.unshift({date:'Season '+S.season,title:'Contract signed',body:o.role+' · $'+o.salary+' per season · '+o.years+' years'});S.emails.unshift(mail('Contract signed — congratulations','You have signed with '+o.club+'.\n\nWage: $'+o.salary+' per season\nSigning bonus: $'+o.signingBonus+'\nLength: '+o.years+' seasons\nSquad role: '+o.role+'\nPerformance bonus: $'+o.performanceBonus+' per milestone.','Club Manager'));S.unread=(S.unread||0)+1;S.pendingOffer=null;save();render();}
  window.offerContract=function(){if(!S)return;const market=contractMarket();if(S.contract&&S.contract.yearsLeft>0&&S.contract.level>=S.lv){S.news.unshift('You already have an active contract. You can negotiate again when it expires or you move up a level.');save();render();return;}S.pendingOffer={club:S.country==='England'?(S.lv<=2?S.county:S.lv===3?'England Lions':'England'):(S.lv===0?S.club:S.lv===1||S.lv===2?'South Australia Redbacks':S.lv===3?(S.bbl||'Adelaide Strikers'):'Cricket Australia'),salary:market,signingBonus:Math.round(market*.1),years:2,role:rating(S)>75?'Important player':rating(S)>55?'Rotation player':'Squad player',performanceBonus:Math.round(market*.05),market};S.news.unshift('A contract offer has arrived. Review the terms and negotiate.');S.emails.unshift(mail('Contract offer received','The club has made you a playing contract offer. Open Life & Media to review and negotiate the terms.','Club Manager'));S.unread=(S.unread||0)+1;save();render();};
  window.updateOffer=function(key,value){if(!S||!S.pendingOffer)return;const o=S.pendingOffer;if(key==='salary'||key==='signingBonus'||key==='years'||key==='performanceBonus')o[key]=Math.max(0,Math.min(key==='years'?5:2000000,Math.round(Number(value)||0)));else if(key==='role')o.role=value;save();};
  window.negotiateContract=function(){if(!S||!S.pendingOffer)return;const o=S.pendingOffer,ceiling=Math.round(o.market*(1.08+S.rep/250));const bonusCeiling=Math.round(o.market*(.22+S.rep/500));if(o.salary<=ceiling&&o.signingBonus<=bonusCeiling&&o.years>=1&&o.years<=5){o.salary=Math.max(o.salary,Math.round(o.market*.9));o.signingBonus=Math.min(o.signingBonus,bonusCeiling);S.news.unshift('The club accepted your negotiated contract terms.');acceptContract();return;}if(o.salary<=ceiling*1.18&&o.signingBonus<=bonusCeiling*1.5){o.salary=Math.round(ceiling);o.signingBonus=Math.round(bonusCeiling);o.years=Math.max(1,Math.min(4,o.years));S.news.unshift('The club has counter-offered. Review the revised wage and bonus.');S.emails.unshift(mail('Club counter-offer','The club cannot meet your full request. We have improved the wage and signing bonus. Review the updated offer.','Club Manager'));S.unread=(S.unread||0)+1;save();render();return;}S.news.unshift('The club rejected your demands and withdrew the offer. You can try again after improving your form or reputation.');S.emails.unshift(mail('Contract negotiations ended','The club has withdrawn its offer after your requested terms were too far above its budget.','Club Manager'));S.unread=(S.unread||0)+1;S.pendingOffer=null;save();render();};
  window.acceptCurrentOffer=acceptContract;
  window.rejectContract=function(){if(!S||!S.pendingOffer)return;S.pendingOffer=null;S.news.unshift('You rejected the contract offer.');S.timeline.unshift({date:'Season '+S.season,title:'Contract offer rejected',body:'You decided not to accept the club terms.'});save();render();};
  window.claimSponsor=function(){if((S.sponsors||[]).length){S.news.unshift('You already have an active sponsor.');render();return;}if(S.followers<500){S.news.unshift('Sponsors want at least 500 followers. Build your profile first.');render();return;}const pay=Math.round(150+S.followers*.12);S.sponsors.push('Local Cricket Sportswear');S.money+=pay;S.earnings=(S.earnings||0)+pay;S.news.unshift('Signed a Local Cricket Sportswear sponsorship for $'+pay+'.');S.timeline.unshift({date:'Season '+S.season,title:'First sponsorship signed',body:'Local Cricket Sportswear · $'+pay});S.emails.unshift(mail('Sponsorship offer confirmed','Congratulations. Local Cricket Sportswear has offered you a simulated sponsorship payment of $'+pay+'.','Club Manager'));S.unread++;save();render();};
  window.sendCoachMessage=function(){const to=document.getElementById('mailTo')?.value,subject=document.getElementById('mailSubject')?.value?.trim(),body=document.getElementById('mailBody')?.value?.trim();if(!to||!subject||!body){alert('Choose a coach and enter a subject and message.');return;}S.sent.unshift({id:Date.now()+Math.random(),from:to,subject,body,date:'Season '+S.season,read:true});S.emails.unshift(mail('Reply from '+to,coachReply(to,body),to));S.unread=(S.unread||0)+1;S.news.unshift('Your message to '+to+' was sent.');S.openMail=null;save();render();};
  function coachReply(to,body){const t=body.toLowerCase();if(t.includes('select'))return 'Thanks for reaching out. Selection is based on form, role balance, fitness and recent performances. Keep preparing and we will review you at the next selection meeting.';if(t.includes('wage')||t.includes('contract'))return 'Thanks for your message. Contract discussions are handled through the Life & Media tab. Review the current offer there and submit a realistic counter-offer.';if(t.includes('bat')||t.includes('technique'))return 'Work on your balance, watch the ball closely and build innings before expanding your scoring options. Quality repetitions matter more than simply hitting more balls.';if(t.includes('bowl'))return 'Focus on a repeatable action, consistent line and length, and building pressure. Review your workload and make sure you recover between bowling sessions.';return 'Thanks for the message. Keep your training consistent, manage your energy and keep producing performances. We will review your progress at the next team meeting.';}
  window.openMail=function(id){const m=(S.emails||[]).find(x=>x.id==id);if(m){m.read=true;S.unread=Math.max(0,(S.unread||0)-1);S.openMail=id;save();render();}};
  window.replyMail=function(id){const m=(S.emails||[]).find(x=>x.id==id);if(!m)return;S.sent.unshift({id:Date.now()+Math.random(),from:m.from,subject:'Re: '+m.subject,body:'Thank you for the update. I will keep working and let you know if I need anything else.',date:'Season '+S.season,read:true});S.emails.unshift(mail('Reply from '+m.from,'Thanks for your reply. We appreciate you keeping in touch. Keep working hard and we will review your progress soon.',m.from));S.unread=(S.unread||0)+1;S.news.unshift('You replied to '+m.from+'.');S.openMail=null;save();render();};
  window.composeCoach=function(){S.composeOpen=!S.composeOpen;render();};
  window.coachAdvice=function(type){const advice={batting:'Build your technique and timing first. Use controlled sessions, then add power work. Review shot selection and avoid training hard when fatigued.',bowling:'Prioritise accuracy and a repeatable action. Add pace or variations gradually. Do not stack heavy bowling sessions without recovery.',fitness:'Build fitness consistently. Use lighter sessions when energy is low and take rest days seriously.',selection:'Selection is based on role, current form, fitness, performances and team balance. Keep your standards high and communicate with staff.'};S.emails.unshift(mail('Coach advice — '+type,advice[type],'Coaching Staff'));S.unread=(S.unread||0)+1;S.openMail=S.emails[0].id;save();render();};
  // Award a trophy for finishing top of a competition; record season progression.
  const oldEnd=endSeason;endSeason=function(){const before=S.lv,sorted=Object.entries(S.ladder).sort((a,b)=>b[1]-a[1]),stt=S.stats['s'+S.lv];if(S.contract&&S.contract.yearsLeft>0){const wage=S.contract.salary||0;const performanceBonus=(stt&&(stt.runs>=500||stt.w>=20))?(S.contract.performanceBonus||0):0;S.money+=wage+performanceBonus;S.earnings=(S.earnings||500)+wage+performanceBonus;S.news.unshift('Season contract payment received: $'+wage+(performanceBonus?' plus $'+performanceBonus+' performance bonus':'')+'.');S.emails.unshift(mail('Season contract payment','Your seasonal playing contract payment of $'+wage+' has been paid.'+(performanceBonus?' You also earned a $'+performanceBonus+' performance bonus.':''),'Club Finance'));S.unread++;S.contract.yearsLeft--;if(S.contract.yearsLeft===0){S.news.unshift('Your playing contract has expired. Negotiate a new deal in Life & Media.');S.emails.unshift(mail('Contract expired','Your current playing contract has ended. Speak with the club about a new deal.','Club Manager'));S.unread++;}}if(sorted.length&&sorted[0][0]===teamName()){S.trophies=S.trophies||[];S.trophies.push({title:LV[before].n+' — League winners',date:'Season '+S.season,detail:'Finished top of the ladder'});S.awards.push('Competition winners — '+LV[before].n);S.emails.unshift(mail('Congratulations — competition winners','You finished top of the '+LV[before].n+' ladder. The club is proud of your season.','Club President'));S.unread++;}S.timeline.unshift({date:'Season '+S.season,title:'Season completed',body:'Finished '+(sorted.findIndex(x=>x[0]===teamName())+1)+' on the ladder in '+LV[before].n+'.'});oldEnd();};
  // Existing save files are upgraded safely without resetting careers.
  if(S){if(S.country==="England"&&!S.countyDivision)S.countyDivision=ENG_DIV1.includes(S.county||S.club)?1:2;if(S.country==="England"&&S.lv===2&&!S.engFormat)S.engFormat="Metro Bank One-Day Cup";setCareerCountry(S.country||"Australia",S.county||S.club,S.countyDivision);Object.assign(S,{keeping:S.keeping??35,mental:S.mental??40,discipline:S.discipline??40,leadership:S.leadership??40,sponsors:S.sponsors||[],contracts:S.contracts||[],trophies:S.trophies||[],timeline:S.timeline||[],emails:S.emails||[],sent:S.sent||[],unread:S.unread||0,careerMatches:S.careerMatches||0,careerRuns:S.careerRuns||0,careerWickets:S.careerWickets||0,awards:S.awards||[],composeOpen:false,pendingOffer:S.pendingOffer||null});if(S.contract&&S.contract.yearsLeft==null)S.contract.yearsLeft=1;if(S.contract&&!S.contract.club)S.contract.club=S.contract.name||S.club;if(S.contract&&!S.contract.squadRole)S.contract.squadRole='Squad player';S.unread=S.emails.filter(m=>!m.read).length;if(!S.timeline.length)S.timeline.push({date:'Season '+S.season,title:'Career continued',body:'Your saved career has been upgraded with new features.'});save();}
  render();
})();

</script></body></html>
